name: Build and check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run build
      - run: npm run check
      - run: python3 tests/test_settings.py
      - run: git diff --exit-code -- dist/ themes/ custom_components/nightwave/www/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_browser.py
      - run: python tests/test_settings_browser.py
      - run: python tests/test_parity_browser.py
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Custom-repository release; a brands submission is separate.
          ignore: brands
